# Development stack. Ports are bound to 127.0.0.1 on the host on purpose:
# the API can write files and run tests, so it must not be reachable from the LAN.
services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - WORKSPACE_ROOT=/data/workspaces
      - VEXA_DB_PATH=/data/vexa.sqlite3
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - VEXA_A2A_VERIFIER_URL=http://verifier-agent:8101
    volumes:
      - vexa_data:/data

  # OPTIONAL external Google ADK Verifier over A2A. The backend embeds one by default;
  # this service is used only with VEXA_A2A_EMBEDDED=false (set the same VEXA_A2A_TOKEN on both).
  # It reads the same workspaces volume, read-only.
  verifier-agent:
    build: .
    command: ["python", "-m", "backend.a2a_bridge.verifier_server", "--host", "0.0.0.0", "--port", "8101", "--mode", "router"]
    env_file:
      - .env
    environment:
      - WORKSPACE_ROOT=/data/workspaces
    volumes:
      - vexa_data:/data:ro
    expose:
      - "8101"

volumes:
  vexa_data:
