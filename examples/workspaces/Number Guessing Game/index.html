<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>🔢 Number Guessing Game</h1>
    <p class="sub">I'm thinking of a number between 1 and 100.</p>
<div class="card center"><p id="msg" class="muted">Make a guess!</p><div class="row" style="justify-content:center"><input id="guess" type="number" min="1" max="100" style="width:120px;font-size:20px;text-align:center"><button id="go">Guess</button></div>
<p id="range" class="muted"></p><div class="bar"><div id="heat"></div></div><p id="tries"></p><button class="ghost" id="restart">New game</button></div>
<div class="card"><b>Your guesses</b> <span class="muted" id="best"></span><div id="guesses" class="row" style="margin-top:8px"></div></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
