<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>Random Quote Generator</h1>
    </header>
    <main class="container" role="main">
        <section class="quote-section" aria-live="polite" aria-atomic="true">
            <p id="quote" class="quote-text">Loading quote...</p>
        </section>
        <div class="button-group">
            <button id="new-quote" class="btn" aria-label="Get a new quote">New Quote</button>
            <button id="copy-quote" class="btn" aria-label="Copy quote to clipboard">Copy</button>
        </div>
        <div id="toast" class="toast" role="status" aria-live="assertive" hidden>Quote copied!</div>
    </main>
    <script src="script.js"></script>
</body>
</html>
