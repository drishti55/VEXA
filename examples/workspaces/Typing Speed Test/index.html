<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Speed Test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>⌨️ Typing Speed Test</h1>
    <p class="sub">Type the passage as fast and accurately as you can.</p>
<div class="card"><div class="row"><label>Duration</label><select id="dur"><option value="30">30 s</option><option value="60" selected>60 s</option><option value="120">120 s</option></select><span class="grow"></span><button class="ghost" id="restart">Restart</button></div></div>
<div class="card"><div id="text" style="font-size:20px;line-height:1.7;font-family:ui-monospace,Menlo,monospace;user-select:none"></div>
<textarea id="input" rows="3" placeholder="Start typing to begin…" style="margin-top:12px" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></div>
<div class="card stats"><div class="stat"><b id="time">60</b>seconds</div><div class="stat"><b id="wpm">0</b>WPM</div><div class="stat"><b id="acc">100%</b>accuracy</div><div class="stat"><b id="best">–</b>best WPM</div></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
