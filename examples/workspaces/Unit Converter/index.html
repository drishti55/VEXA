<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>📏 Unit Converter</h1>
    <p class="sub">Length, weight, temperature, volume, speed, time and data.</p>
<div class="card"><select id="cat" style="width:100%"></select>
<div class="row" style="margin-top:12px"><input id="from" type="number" value="1" class="grow"><select id="fu"></select></div>
<div class="center" style="margin:8px 0"><button class="ghost small" id="swap">⇅ Swap</button></div>
<div class="row"><input id="to" type="number" class="grow"><select id="tu"></select></div>
<p class="muted center" id="formula"></p></div>
<div class="card"><b>All units</b><ul id="all" class="list"></ul></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
