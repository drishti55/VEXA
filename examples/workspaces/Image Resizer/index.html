<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>🖼️ Image Resizer</h1>
    <p class="sub">Resize and convert images locally — nothing is uploaded.</p>
<div class="card"><input id="file" type="file" accept="image/*" style="width:100%"><p class="muted" id="orig" style="margin:6px 0 0">Choose an image or drop it here.</p></div>
<div class="card"><div class="row"><label>Width</label><input id="w" type="number" min="1" style="width:100px"><label>Height</label><input id="h" type="number" min="1" style="width:100px"><label><input type="checkbox" id="lock" checked> keep ratio</label></div>
<div class="row" style="margin-top:8px"><label>Scale</label><button class="ghost small" data-scale="0.25">25%</button><button class="ghost small" data-scale="0.5">50%</button><button class="ghost small" data-scale="0.75">75%</button><button class="ghost small" data-scale="1">100%</button></div>
<div class="row" style="margin-top:8px"><label>Format</label><select id="fmt"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select><label>Quality</label><input id="q" type="range" min="0.1" max="1" step="0.05" value="0.9"><span id="qv">90%</span></div>
<div class="row" style="margin-top:10px"><button id="go" disabled>Resize</button><a id="dl" hidden><button class="ghost">Download</button></a><span class="muted" id="outInfo"></span></div></div>
<div class="card center"><canvas id="canvas" style="max-width:100%;border-radius:6px"></canvas></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
