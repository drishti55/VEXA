<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="quiz-container" class="quiz-container">
    <h1>Quiz</h1>
    <div id="question-area" class="question-area"></div>
    <div id="navigation" class="navigation">
      <button id="prev-btn" class="nav-btn" disabled>Previous</button>
      <button id="next-btn" class="nav-btn">Next</button>
    </div>
    <div id="result-area" class="result-area" hidden></div>
    <button id="restart-btn" class="restart-btn" hidden>Restart Quiz</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
