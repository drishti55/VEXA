<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>✅ Habit Tracker</h1>
    <p class="sub">Track habits over the last 7 days and build streaks.</p>
<div class="card"><div class="row"><input id="habit" class="grow" placeholder="New habit, e.g. Drink water"><button id="add">Add habit</button></div></div>
<div class="card" style="overflow-x:auto"><table id="grid" style="width:100%;border-collapse:collapse"></table></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
