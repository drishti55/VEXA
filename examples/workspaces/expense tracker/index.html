<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Expense Tracker</h1>
    </header>
    <main>
        <section class="form-section">
            <form id="expense-form" novalidate>
                <div class="form-group">
                    <label for="expense-name">Expense Name</label>
                    <input type="text" id="expense-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="expense-amount">Amount</label>
                    <input type="number" id="expense-amount" name="amount" step="0.01" min="0.01" required>
                </div>
                <button type="submit">Add Expense</button>
            </form>
            <p id="error-message" class="error" aria-live="polite"></p>
        </section>
        <section class="list-section">
            <h2>Expenses</h2>
            <ul id="expense-list"></ul>
            <p id="total-amount">Total: $0.00</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Expense Tracker</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
