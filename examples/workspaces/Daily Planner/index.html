<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>📅 Daily Planner</h1>
    <p class="sub">Plan your day hour by hour. Plans are saved per date.</p>
<div class="card"><div class="row"><button class="ghost small" id="prev">◀</button><input id="date" type="date"><button class="ghost small" id="next">▶</button><span class="grow"></span><button class="ghost small" id="clear">Clear day</button></div></div>
<div class="card" id="slots"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
