<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>🗓️ Attendance Tracker</h1>
    <p class="sub">Mark who is present each day and see attendance rates.</p>
<div class="card"><div class="row"><input id="name" class="grow" placeholder="Student name"><button id="add">Add student</button></div></div>
<div class="card"><div class="row"><label for="date">Date</label><input id="date" type="date"><span class="grow"></span><span id="summary" class="muted"></span></div>
<ul id="list" class="list"></ul></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
