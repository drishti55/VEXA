<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>💘 Love Calculator</h1>
    <p class="sub">A just-for-fun compatibility score from two names.</p>
<div class="card"><div class="row"><input id="a" class="grow" placeholder="Your name"><span>❤️</span><input id="b" class="grow" placeholder="Their name"></div>
<button id="go" style="width:100%;margin-top:10px">Calculate</button></div>
<div class="card center" id="result" hidden><p class="big" id="pct"></p><div class="bar"><div id="bar" style="background:#ff6b9d"></div></div><p id="msg"></p>
<p class="muted" style="font-size:12px">The score is a hash of the two names — same names, same score. It means nothing, have fun!</p></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
