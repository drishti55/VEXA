[project]
name = "vexa"
version = "0.1.0"
description = "Architecture-Aware Autonomous Multi-Agent Software Engineering System"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",         # used by FastAPI TestClient
    "crewai>=1.0.0",         # M3 multi-agent framework
    "litellm",
    "google-adk[a2a]>=2.0",  # Google ADK agents (exposed over A2A)
    "a2a-sdk[http-server]>=1.0",
    "sqlalchemy>=2.0",       # run registry / experiment persistence (SQLite)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live: calls a real LLM provider (opt-in: VEXA_LIVE_TESTS=1, keys from .env); costs tokens",
]
filterwarnings = [
    "ignore::DeprecationWarning:crewai.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::UserWarning:google.adk.*",
    "ignore::DeprecationWarning:google.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
